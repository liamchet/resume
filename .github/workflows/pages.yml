name: Publish personal profile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate portfolio
        run: |
          npm install --no-save playwright
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('file://' + process.cwd() + '/dist/index.html');
            await page.locator('#community').scrollIntoViewIfNeeded();
            await page.locator('.gallery-window img').evaluateAll(async imgs => { await Promise.all(imgs.map(img => { img.loading = 'eager'; return img.decode(); })); });
            assert.equal(await page.locator('.gallery-window img').count(), 10);
            assert.equal(await page.locator('.case').count(), 15);
            await page.locator('#gallery-pause').click();
            await page.locator('#gallery-next').click();
            assert.equal(await page.locator('#gallery-count').innerText(), '02 / 10');
            await page.locator('#gallery-prev').click();
            await page.locator('#gallery-prev').click();
            assert.equal(await page.locator('#gallery-count').innerText(), '10 / 10');
            await page.locator('.case summary').first().click();
            assert.equal(await page.locator('.case[open]').count(), 1);
            await page.getByRole('tab', { name: /Enterprise assistants/ }).click();
            assert.match(await page.locator('#project-title').innerText(), /Useful answers/);
            await page.setViewportSize({ width: 390, height: 844 });
            assert.equal(await page.evaluate(() => document.documentElement.scrollWidth > innerWidth), false);
            await page.emulateMedia({ reducedMotion: 'reduce' });
            assert.equal(await page.locator('#gallery-pause').getAttribute('aria-label'), 'Play photo rotation');
            const links = await page.locator('a[href]').evaluateAll(a => a.map(x => x.getAttribute('href')).filter(x => !/^(https?:|mailto:|#)/.test(x)));
            for (const link of links) assert.ok(fs.existsSync('dist/' + link), 'Missing link: ' + link);
            assert.deepEqual(errors, []);
            assert.equal(fs.readFileSync('dist/index.html', 'utf8'), fs.readFileSync('dist/Liam_Chetrit_Profile.html', 'utf8'));
            console.log('PASS: 10 decoded gallery images; 15 case studies; navigation and wrap; project tabs; mobile layout; reduced motion; resume links; matching profile copies.');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish personal profile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Diagnose public endpoints
        run: |
          node <<'NODE'
          (async()=>{for(const p of ['', 'Liam_Chetrit_Resume.html','Liam_Chetrit_Resume.pdf','Resume_Versions.html','Liam_Chetrit_AI_PM_Builder.pdf']){
            try{const r=await fetch('https://liamchet.github.io/resume/'+p);console.log('BEFORE',p||'/',r.status,r.headers.get('content-type'));await r.arrayBuffer()}catch(e){console.log('BEFORE',p,e.message)}
          }})()
          NODE
      - name: Install and build portfolio
        run: |
          npm install --prefix _Technical/Website
          node _Technical/Website/build.cjs
      - name: Validate portfolio
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const { chromium } = require('./_Technical/Website/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('file://' + process.cwd() + '/dist/index.html');
            await page.locator('#community').scrollIntoViewIfNeeded();
            await page.locator('.gallery-window img').evaluateAll(async imgs => { await Promise.all(imgs.map(img => { img.loading = 'eager'; return img.decode(); })); });
            assert.equal(await page.locator('.gallery-window img').count(), 10);
            assert.equal(await page.locator('.project-card').count(), 3);
            await page.waitForFunction(()=>document.querySelectorAll('.specular-button').length===3);
            assert.equal(await page.locator('#motion-toggle').count(), 1);
            await page.locator('#gallery-pause').click();
            const startIndex=Number((await page.locator('#gallery-count').innerText()).slice(0,2));
            await page.locator('#gallery-next').click();
            assert.equal(Number((await page.locator('#gallery-count').innerText()).slice(0,2)),startIndex%10+1);
            await page.locator('#gallery-prev').click();
            await page.locator('#gallery-prev').click();
            assert.equal(Number((await page.locator('#gallery-count').innerText()).slice(0,2)),(startIndex+8)%10+1);
            await page.locator('.project-card summary').first().click();
            assert.equal(await page.locator('.project-card[open]').count(), 1);
            await page.locator('.project-card[open] [data-view="after"]').click();
            assert.equal(await page.locator('.project-card[open] [data-view="after"]').getAttribute('aria-pressed'),'true');
            await page.locator('.project-card[open] .flow-step').nth(2).click();
            assert.match(await page.locator('.project-card[open] .flow-detail').innerText(),/permissions/);
            for(const card of await page.locator('.project-card').all()){
              if((await card.getAttribute('open'))===null) await card.locator('summary').click();
              await card.locator('.flow-step').last().click();
              assert.equal(await card.locator('.flow-step.active').count(),1);
            }
            fs.mkdirSync('_Technical/QA',{recursive:true});
            await page.screenshot({path:'_Technical/QA/desktop.png',fullPage:true});
            await page.setViewportSize({ width: 390, height: 844 });
            assert.equal(await page.evaluate(() => document.documentElement.scrollWidth > innerWidth), false);
            await page.screenshot({path:'_Technical/QA/mobile.png',fullPage:true});
            await page.emulateMedia({ reducedMotion: 'reduce' });
            assert.equal(await page.locator('#gallery-pause').getAttribute('aria-label'), 'Play photo rotation');
            const links = await page.locator('a[href]').evaluateAll(a => a.map(x => x.getAttribute('href')).filter(x => !/^(https?:|mailto:|#)/.test(x)));
            for (const link of links) assert.ok(fs.existsSync('dist/' + link), 'Missing link: ' + link);
            assert.deepEqual(errors, []);
            assert.equal(fs.readFileSync('dist/index.html', 'utf8'), fs.readFileSync('dist/Liam_Chetrit_Profile.html', 'utf8'));
            console.log('PASS: 10 decoded images; 3 project workflows; React Bits buttons; comparisons and steps; mobile layout; reduced motion; resume links.');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Render both resume versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('./_Technical/Website/node_modules/playwright');
          const { PDFDocument } = require('./_Technical/Website/node_modules/pdf-lib');
          (async () => {
            const browser = await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const name of ['Liam_Chetrit_Resume','Liam_Chetrit_AI_Product_Manager','Liam_Chetrit_AI_PM_Builder']) {
              const page = await browser.newPage();
              await page.goto('file://' + process.cwd() + '/dist/' + name + '.html');
              await page.emulateMedia({media:'print'});
              await page.pdf({path:'dist/'+name+'.pdf',preferCSSPageSize:true,printBackground:true});
              const doc = await PDFDocument.load(fs.readFileSync('dist/'+name+'.pdf'));
              if(doc.getPageCount()<1||doc.getPageCount()>2) throw new Error(name+' must fit at most two A4 pages; got '+doc.getPageCount());
              const size=doc.getPage(0).getSize();
              if(Math.abs(size.width-595)>2||Math.abs(size.height-842)>2)throw new Error('Wrong paper size');
              const layout=await page.locator('.paper').evaluate(el=>({height:el.clientHeight,content:el.scrollHeight}));
              if(layout.content>layout.height+1)throw new Error('Resume content overflows A4');
              console.log('A4_VERIFIED '+name+' pages='+doc.getPageCount());
              console.log('RESUME_TEXT '+(await page.locator('.paper').innerText()).replace(/\\n/g,' | '));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Keep root and dist publication files identical
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const name of fs.readdirSync('dist')){
            if(name==='.nojekyll'||name.endsWith('.html')||name.endsWith('.pdf'))fs.copyFileSync('dist/'+name,name);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html Liam_Chetrit_Profile.html Liam_Chetrit_Resume.html Liam_Chetrit_Resume.pdf Liam_Chetrit_AI_Product_Manager.html Liam_Chetrit_AI_Product_Manager.pdf Liam_Chetrit_AI_PM_Builder.html Liam_Chetrit_AI_PM_Builder.pdf Resume_Versions.html dist _Technical/Website/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize public resume PDFs and Pages entry points [skip ci]"
            git push origin HEAD:main
          fi
      - name: Save review screenshots and downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: Liam-Chetrit-Updated-Portfolio
          path: |
            dist/
            _Technical/QA/
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website and resume downloads
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const crypto = require('crypto');
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          (async () => {
            const base = process.env.SITE_URL;
            assert.ok(base && base.startsWith('https://'));
            for (const [urlPath, localPath] of [['', 'index.html'], ['Liam_Chetrit_Resume.html', 'Liam_Chetrit_Resume.html'], ['Liam_Chetrit_Resume.pdf', 'Liam_Chetrit_Resume.pdf'], ['Resume_Versions.html','Resume_Versions.html'], ['Liam_Chetrit_AI_PM_Builder.pdf','Liam_Chetrit_AI_PM_Builder.pdf'], ['Liam_Chetrit_AI_Product_Manager.pdf','Liam_Chetrit_AI_Product_Manager.pdf']]) {
              let verified = false;
              for (let attempt = 0; attempt < 6; attempt++) {
                const response = await fetch(new URL(urlPath, base));
                const bytes = Buffer.from(await response.arrayBuffer());
                if (response.ok && hash(bytes) === hash(fs.readFileSync('dist/' + localPath))) { verified = true; break; }
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
              assert.ok(verified, 'Public file did not match deployed source: ' + urlPath);
            }
            console.log('PUBLIC_SITE_VERIFIED ' + base);
            console.log('PUBLIC_RESUME_HTML_VERIFIED ' + new URL('Liam_Chetrit_Resume.html', base));
            console.log('PUBLIC_RESUME_PDF_VERIFIED ' + new URL('Liam_Chetrit_Resume.pdf', base));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
